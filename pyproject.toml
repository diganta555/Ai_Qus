[project]
name = "ai-qus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Diganta Ray", email = "digantaray669@.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.141.1",
    "fpdf2>=2.8.8",
    "httpx>=0.28.1",
    "langchain-openai>=1.6.2",
    "passlib[bcrypt]>=1.7.4",
    "plotly>=7.1.0",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.54",
    "streamlit>=1.64.0",
    "uvicorn>=0.53.0",
    "langchain-groq>=1.1.3",
    "bcrypt==4.0.1",
]

[project.scripts]
ai-qus = "ai_qus:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
